name: Sync Skill From Upstream

# Receives repository_dispatch events from upstream skill source repos. The
# allowed sources, and where each skill lives, are listed in
# registry-sources.json (one key per source repo). Pulls the per-source subtree,
# rsyncs it into skills/<name>/, removes the skill directories the source
# replaces, updates index.json, bumps the version triplet, and pushes to main.
# Push triggers deploy-registry.yml via paths:["skills/**"].
#
# Security model:
#   - All client_payload.* values pass through step-level env: blocks;
#     never inlined into run: scripts.
#   - The source key, version and sha are validated against fixed patterns
#     BEFORE any checkout or token step runs; the source key must also exist in
#     registry-sources.json as read from main. Repo, branch and skill come from
#     that file, never from the payload.
#   - Upstream repositories are public, so they are read with the default
#     token. The registry push uses the anilcancakir-ai-registry GitHub App,
#     whose token is minted per run and scoped to this repository. No PATs.

on:
    repository_dispatch:
        types: [skill-updated]
    workflow_dispatch:
        inputs:
            source:
                description: "Source key from registry-sources.json (for example dowel)"
                required: true
                type: string
            version:
                description: "Upstream version (semver, optionally with -prerelease)"
                required: true
                type: string
            sha:
                description: "Upstream commit sha (40 hex chars, optional)"
                required: false
                type: string
                default: ""

permissions:
    contents: write

concurrency:
    # Global lock: every sync touches the same version triplet (plugin.json +
    # marketplace.json) and the same skills/index.json. Parallel syncs would race
    # on the patch-bump read-modify-write and the second one's push would fail
    # non-fast-forward. Serialize all source syncs through one queue.
    group: "sync-registry"
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Validate version
              env:
                  VER: ${{ github.event.client_payload.version || inputs.version }}
              run: |
                  set -euo pipefail
                  if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
                      echo "::error::invalid version: $VER"
                      exit 1
                  fi

            - name: Validate sha
              env:
                  SHA: ${{ github.event.client_payload.sha || inputs.sha }}
              run: |
                  set -euo pipefail
                  if [[ -n "$SHA" && ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::invalid sha: $SHA"
                      exit 1
                  fi

            - name: Resolve source config
              id: cfg
              env:
                  SRC: ${{ github.event.client_payload.source || inputs.source }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if ! [[ "$SRC" =~ ^[a-z][a-z0-9_]*$ ]]; then
                      echo "::error::invalid source: $SRC"
                      exit 1
                  fi

                  # The map is read from main through the API, so nothing is
                  # checked out before the source is known to be allowed.
                  gh api "repos/${GITHUB_REPOSITORY}/contents/registry-sources.json?ref=main" \
                      --jq .content | base64 --decode > "${RUNNER_TEMP}/sources.json"

                  if ! jq -e --arg s "$SRC" 'has($s)' "${RUNNER_TEMP}/sources.json" > /dev/null; then
                      echo "::error::source not allowed: $SRC"
                      exit 1
                  fi

                  REPO=$(jq -r --arg s "$SRC" '.[$s].repo' "${RUNNER_TEMP}/sources.json")
                  BRANCH=$(jq -r --arg s "$SRC" '.[$s].branch' "${RUNNER_TEMP}/sources.json")
                  SKILL=$(jq -r --arg s "$SRC" '.[$s].skill' "${RUNNER_TEMP}/sources.json")
                  REPLACES=$(jq -r --arg s "$SRC" '.[$s].replaces | join(" ")' "${RUNNER_TEMP}/sources.json")

                  [[ "$REPO" =~ ^anilcancakir/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid repo in map: $REPO"; exit 1; }
                  [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid branch in map: $BRANCH"; exit 1; }
                  [[ "$SKILL" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid skill in map: $SKILL"; exit 1; }
                  for OLD in $REPLACES; do
                      [[ "$OLD" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid replaced skill in map: $OLD"; exit 1; }
                  done

                  {
                      echo "repo=$REPO"
                      echo "branch=$BRANCH"
                      echo "skill=$SKILL"
                      echo "subpath=skills/$SKILL"
                      echo "replaces=$REPLACES"
                  } >> "$GITHUB_OUTPUT"

            - name: Mint App token (registry write)
              id: app-token
              uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
              with:
                  app_id: ${{ secrets.REGISTRY_BOT_APP_ID }}
                  private_key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
                  installation_retrieval_mode: repository
                  installation_retrieval_payload: ${{ github.repository }}
                  repositories: '["${{ github.event.repository.name }}"]'

            - name: Checkout registry
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 0

            - name: Checkout upstream subtree
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ steps.cfg.outputs.repo }}
                  ref: ${{ steps.cfg.outputs.branch }}
                  sparse-checkout: ${{ steps.cfg.outputs.subpath }}
                  sparse-checkout-cone-mode: false
                  path: tmp-upstream-${{ steps.cfg.outputs.skill }}
                  token: ${{ github.token }}
                  persist-credentials: false

            - name: Sync, bump, and push
              id: sync
              env:
                  SKILL: ${{ steps.cfg.outputs.skill }}
                  SUBPATH: ${{ steps.cfg.outputs.subpath }}
                  REPLACES: ${{ steps.cfg.outputs.replaces }}
                  VER: ${{ github.event.client_payload.version || inputs.version }}
                  TOKEN: ${{ steps.app-token.outputs.token }}
                  BOT_USER_EMAIL: ${{ vars.REGISTRY_BOT_USER_EMAIL }}
              run: |
                  set -euo pipefail

                  git config user.name "anilcancakir-ai-registry[bot]"
                  # BOT_USER_EMAIL must be set as a repo variable, format:
                  # "<bot-user-id>+anilcancakir-ai-registry[bot]@users.noreply.github.com"
                  # Falls back to a placeholder that any sane App owner will replace post-install.
                  git config user.email "${BOT_USER_EMAIL:-anilcancakir-ai-registry[bot]@users.noreply.github.com}"
                  git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Rebuild the whole change on top of the live main on every attempt.
                  # The concurrency group serializes jobs but does not stop a sibling
                  # sync from pushing between this job's checkout and its push, and
                  # the version bump is a read-modify-write on the same two lines, so
                  # a rebase would conflict exactly where a re-apply cannot. Observed
                  # on 2026-08-03: four dispatches fired together, one landed, one was
                  # rejected non-fast-forward, and its skill update was silently lost.
                  for attempt in 1 2 3; do
                      git fetch --quiet origin main
                      git reset --quiet --hard origin/main

                      mkdir -p "skills/${SKILL}"
                      rsync -a --delete "tmp-upstream-${SKILL}/${SUBPATH}/" "skills/${SKILL}/"
                      for OLD in ${REPLACES}; do
                          rm -rf "skills/${OLD}"
                      done
                      node scripts/update-skill-index.mjs

                      CUR=$(jq -r .version .claude-plugin/plugin.json)
                      MAJ=${CUR%%.*}
                      REST=${CUR#*.}
                      MIN=${REST%%.*}
                      PATCH=${REST#*.}
                      NEW="${MAJ}.${MIN}.$((PATCH + 1))"
                      # --indent 4 matches the repo's JSON style (CLAUDE.md); plain jq
                      # would rewrite both manifests at 2 spaces and turn a one-line
                      # version bump into a whole-file diff.
                      jq --indent 4 --arg v "$NEW" '.version = $v' .claude-plugin/plugin.json > .claude-plugin/plugin.json.tmp
                      mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json
                      jq --indent 4 --arg v "$NEW" '.version = $v | .plugins[0].version = $v' .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp
                      mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json

                      git add skills/ .claude-plugin/plugin.json .claude-plugin/marketplace.json
                      if git diff --cached --quiet; then
                          echo "no changes after sync; skipping commit"
                          echo "committed=false" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi

                      git commit --quiet -m "chore: sync ${SKILL} from upstream ${VER}, bump to v${NEW}"
                      if git push --quiet origin HEAD:main; then
                          echo "new=$NEW" >> "$GITHUB_OUTPUT"
                          echo "committed=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi

                      echo "::warning::push rejected on attempt ${attempt}; a sibling sync landed first, rebuilding on the new main"
                      sleep $((attempt * 5))
                  done

                  echo "::error::could not push after 3 attempts"
                  exit 1

            - name: Create GitHub Release
              if: steps.sync.outputs.committed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  NEW: ${{ steps.sync.outputs.new }}
                  SKILL: ${{ steps.cfg.outputs.skill }}
                  VER: ${{ github.event.client_payload.version || inputs.version }}
                  SHA_UP: ${{ github.event.client_payload.sha || inputs.sha }}
                  REPO_UP: ${{ steps.cfg.outputs.repo }}
                  BRANCH_UP: ${{ steps.cfg.outputs.branch }}
              run: |
                  set -euo pipefail
                  if [[ -n "$SHA_UP" ]]; then
                      SHA_LINE="**Upstream commit**: [\`${SHA_UP:0:7}\`](https://github.com/${REPO_UP}/commit/${SHA_UP})"
                  else
                      SHA_LINE="**Upstream**: manual dispatch (no commit sha)"
                  fi
                  cat > /tmp/release-notes.md <<EOF
                  Auto-sync of \`${SKILL}\` from [\`${REPO_UP}\`](https://github.com/${REPO_UP}) @ \`${VER}\` (branch \`${BRANCH_UP}\`).

                  ${SHA_LINE}
                  **Registry version**: \`v${NEW}\`

                  ## Install

                  \`\`\`bash
                  # All skills, all detected AI tools
                  npx skills add anilcancakir/ai

                  # Or via Claude Code plugin marketplace
                  /plugin marketplace add anilcancakir/ai
                  /plugin install anilcancakir@anilcancakir-marketplace
                  \`\`\`

                  ## What changed

                  See the commit on \`main\`: https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)

                  ---
                  *This release was created automatically by the [\`anilcancakir-ai-registry\`](https://github.com/apps/anilcancakir-ai-registry) App when upstream \`${REPO_UP}\` published an update.*
                  EOF
                  gh release create "v${NEW}" \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "v${NEW}: ${SKILL} @ ${VER}" \
                      --notes-file /tmp/release-notes.md \
                      --target main

            - name: Cleanup upstream checkout
              if: always()
              env:
                  SKILL: ${{ steps.cfg.outputs.skill }}
              run: |
                  set -euo pipefail
                  rm -rf "tmp-upstream-${SKILL}"
