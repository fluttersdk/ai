name: CI

# The gate for every pull request and every push to master. No `paths:` filter:
# a filtered check never reports on a pull request outside the filter, and a
# required check that never reports leaves the pull request waiting forever.
# `Lint & Test` is the aggregator the branch ruleset waits for, so the jobs
# behind it can be renamed or added without touching the required check.

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    mcp-bridge:
        name: MCP bridge (build + test)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mcps/fluttersdk-mcp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: mcps/fluttersdk-mcp/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build (tsc strict)
              run: npm run build

            - name: Test (vitest)
              run: npm test

            - name: Package shape (npm pack --dry-run)
              run: npm pack --dry-run

    lint-test:
        name: Lint & Test
        needs: [mcp-bridge, workflows-lint, plugin-validate]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Every gate succeeded
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  set -euo pipefail
                  echo "gate results: ${RESULTS}"
                  for result in ${RESULTS}; do
                      if [[ "${result}" != "success" ]]; then
                          echo "::error::a gate did not succeed (${result})"
                          exit 1
                      fi
                  done

    workflows-lint:
        name: Workflows lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: actionlint
              uses: docker://rhysd/actionlint:1.7.7
              with:
                  args: -color

            - name: dependabot.yml shape
              if: hashFiles('.github/dependabot.yml') != ''
              run: |
                  python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
                  echo "dependabot.yml parses as valid YAML"

    plugin-validate:
        name: Plugin manifest + version sync
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install check-jsonschema
              run: pipx install check-jsonschema==0.37.2

            - name: Validate plugin.json schema
              run: |
                  check-jsonschema \
                      --schemafile https://json.schemastore.org/claude-code-plugin-manifest.json \
                      --no-cache \
                      .claude-plugin/plugin.json

            - name: Validate marketplace.json schema
              run: |
                  check-jsonschema \
                      --schemafile https://json.schemastore.org/claude-code-marketplace.json \
                      --no-cache \
                      .claude-plugin/marketplace.json

            - name: Validate .mcp.json structure
              run: |
                  python3 -c "
                  import json, sys
                  d = json.load(open('.mcp.json'))
                  servers = d.get('mcpServers', {})
                  if not servers:
                      print('ERROR: .mcp.json mcpServers is empty or missing', file=sys.stderr)
                      sys.exit(1)
                  print(f'.mcp.json OK: {len(servers)} server(s): {list(servers.keys())}')
                  "

            - name: Assert 3-way version sync
              run: |
                  PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
                  MARKET_VER=$(jq -r '.version' .claude-plugin/marketplace.json)
                  MARKET_P0_VER=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
                  if [ "$PLUGIN_VER" != "$MARKET_VER" ] || [ "$MARKET_VER" != "$MARKET_P0_VER" ]; then
                      echo "ERROR: version mismatch: plugin.json=$PLUGIN_VER, marketplace.version=$MARKET_VER, marketplace.plugins[0].version=$MARKET_P0_VER"
                      exit 1
                  fi
                  echo "Version sync OK: all three are $PLUGIN_VER"

            - name: Install PyYAML
              # The runner image happens to ship PyYAML today and the gate below
              # passes on it, but an inherited dependency is one image update away
              # from turning this gate into a red build with nothing wrong in the
              # repo. Declare it.
              run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

            - name: Verify command, skill, and agent frontmatter
              run: |
                  python3 - <<'PY'
                  import sys, yaml, pathlib

                  # Every plugin component whose frontmatter Claude Code parses at load
                  # time. A malformed one does not error: the component is skipped and
                  # the capability silently disappears, so this is a gate rather than a
                  # lint. An unquoted description containing ": " is the way it usually
                  # breaks, because YAML reads it as a nested mapping.
                  files = [
                      "commands/flutter-test.md",
                      "skills/flutter-review/SKILL.md",
                      "agents/flutter-reviewer.md",
                      "agents/flutter-reviewer-deep.md",
                  ]

                  # Plugin-shipped agents support this set only, quoted from the plugins
                  # reference. hooks, mcpServers, and permissionMode are dropped for
                  # plugin agents, and color is absent from that list even though the
                  # general subagent docs carry it, so none of them belong here: an
                  # ignored field looks identical to a working one.
                  agent_fields = {
                      "name", "description", "model", "effort", "maxTurns", "tools",
                      "disallowedTools", "skills", "memory", "background", "isolation",
                  }

                  bad = 0
                  for rel in files:
                      p = pathlib.Path(rel)
                      if not p.is_file():
                          print(f"ERROR: {rel} does not exist")
                          bad += 1
                          continue
                      text = p.read_text(encoding="utf-8")
                      if not text.startswith("---"):
                          print(f"ERROR: {rel} does not start with YAML frontmatter")
                          bad += 1
                          continue
                      try:
                          meta = yaml.safe_load(text.split("---")[1])
                      except yaml.YAMLError as exc:
                          print(f"ERROR: {rel} frontmatter does not parse: {exc}")
                          bad += 1
                          continue
                      if not isinstance(meta, dict) or "description" not in meta:
                          print(f"ERROR: {rel} frontmatter has no description")
                          bad += 1
                          continue
                      if rel.startswith("agents/"):
                          unsupported = set(meta) - agent_fields
                          if unsupported:
                              print(f"ERROR: {rel} uses fields plugin agents ignore: {sorted(unsupported)}")
                              bad += 1
                          if ":" in str(meta.get("name", "")):
                              print(f"ERROR: {rel} agent name contains ':', which is reserved for plugin scoping")
                              bad += 1
                      print(f"{rel}: frontmatter OK")

                  sys.exit(1 if bad else 0)
                  PY

            - name: Verify the review skill's plugin-root references resolve
              run: |
                  python3 - <<'PY'
                  import re, sys, pathlib

                  # A ${CLAUDE_PLUGIN_ROOT} path that does not exist fails at review
                  # time, inside a subagent, as a file-not-found the user never sees.
                  sources = [
                      "skills/flutter-review/SKILL.md",
                      "agents/flutter-reviewer.md",
                      "agents/flutter-reviewer-deep.md",
                      "references/flutter-review-core.md",
                  ]
                  pattern = re.compile(r"\$\{CLAUDE_PLUGIN_ROOT\}/([A-Za-z0-9_./-]+)")

                  targets = set()
                  for src in sources:
                      targets.update(pattern.findall(pathlib.Path(src).read_text(encoding="utf-8")))

                  missing = sorted(t for t in targets if not pathlib.Path(t).exists())
                  for t in sorted(targets):
                      print(f"{t}: {'MISSING' if t in missing else 'exists'}")
                  if missing:
                      print(f"ERROR: {len(missing)} referenced plugin file(s) do not exist")
                  sys.exit(1 if missing else 0)
                  PY
