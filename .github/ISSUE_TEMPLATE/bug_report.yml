name: Bug Report
description: Report a bug in the skill registry, the plugin or the installer
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting a bug. A wrong or missing mirrored skill usually belongs in its source repository; if you are unsure, report it here.

    - type: dropdown
      id: component
      attributes:
          label: Component
          options:
              - Registry sync (a skill is stale or missing)
              - Claude Code plugin or marketplace
              - flutter-review skill or subagents
              - scripts/install.sh
              - Tool templates (Cursor, Gemini CLI, OpenCode)
              - OpenCode registry (index.json, Pages)
              - Bundled MCP config (.mcp.json)
              - Documentation
              - Other
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear description of the bug.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to Reproduce
          placeholder: |
              1. Run `npx skills add anilcancakir/ai`
              2. Open the agent
              3. See the problem
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behaviour
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behaviour
          description: Include the full error output if there is any.
      validations:
          required: true

    - type: input
      id: registry-version
      attributes:
          label: Registry Version
          description: The `version:` in `.claude-plugin/plugin.json`, or the latest release tag you installed.
          placeholder: "1.4.90"

    - type: dropdown
      id: tool
      attributes:
          label: AI Tool
          options:
              - Claude Code
              - OpenCode
              - Cursor
              - Gemini CLI
              - Codex CLI
              - Antigravity CLI
              - Cline
              - Roo Code
              - Other
      validations:
          required: true
