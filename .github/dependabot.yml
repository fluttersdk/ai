# Dependabot config for anilcancakir/ai
#
# One ecosystem in scope: github-actions, every workflow under .github/workflows/.
#
# Minor and patch updates roll up into a single weekly PR per logical bucket so
# the queue stays manageable. Major updates open their own PR so breaking
# changes get a human read.
#
# Commit-message prefixes mirror the repo's conventional-commit style (ci).

version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: Europe/Istanbul
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
      assignees:
          - anilcancakir
      commit-message:
          # include: scope already appends "(deps)": keep the prefix parens-free.
          prefix: ci
          include: scope
      groups:
          # First-party actions used everywhere (checkout, pages, etc).
          actions-official:
              patterns:
                  - actions/*
          # App-token + repository-dispatch: keep moving together because they
          # ship in the same auto-sync workflow.
          sync-auth-stack:
              patterns:
                  - tibdex/github-app-token
                  - peter-evans/*
